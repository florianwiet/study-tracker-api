on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Tests ausfuehren
        run: pytest -v
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Docker-Image bauen
        run: docker build -t study-tracker-api .

      - name: Container starten und Health-Check pruefen
        run: |
          docker run -d --name api -p 8000:8000 study-tracker-api
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
