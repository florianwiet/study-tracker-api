<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lern-Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232f6fde'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <h1>Lern-Tracker</h1>
    </div>
    <nav>
      <a href="/docs" target="_blank" rel="noopener">API-Doku</a>
    </nav>
  </header>

  <main>
    <section class="kpis" aria-label="Kennzahlen">
      <article class="kpi"><span class="kpi-label">Gesamt</span><strong id="kpi-total">–</strong></article>
      <article class="kpi"><span class="kpi-label">Letzte 7 Tage</span><strong id="kpi-week">–</strong></article>
      <article class="kpi"><span class="kpi-label">Einträge</span><strong id="kpi-count">–</strong></article>
      <article class="kpi"><span class="kpi-label">Streak</span><strong id="kpi-streak">–</strong></article>
    </section>

    <section class="grid">
      <article class="card chart-card">
        <div class="card-head">
          <h2>Lernzeit pro Tag</h2>
          <div class="controls">
            <select id="chart-subject" aria-label="Fach für Diagramm">
              <option value="">Alle Fächer</option>
            </select>
            <div class="segmented" role="group" aria-label="Zeitraum">
              <button type="button" data-days="7">7 T</button>
              <button type="button" data-days="30" class="active">30 T</button>
              <button type="button" data-days="90">90 T</button>
            </div>
          </div>
        </div>
        <div id="chart" class="chart" role="img" aria-label="Balkendiagramm Lernminuten pro Tag"></div>
        <div id="chart-tooltip" class="tooltip" hidden></div>
      </article>

      <article class="card">
        <div class="card-head"><h2>Fächer</h2></div>
        <ul id="subjects" class="subjects"></ul>
      </article>
    </section>

    <section class="grid">
      <article class="card">
        <div class="card-head">
          <h2 id="form-title">Neue Lerneinheit</h2>
          <button type="button" id="cancel-edit" class="link" hidden>Abbrechen</button>
        </div>
        <form id="entry-form" novalidate>
          <label>Fach
            <input id="f-subject" list="subject-list" maxlength="50" required placeholder="z. B. Mathematik 2">
            <datalist id="subject-list"></datalist>
          </label>
          <div class="row">
            <label>Dauer (Minuten)
              <input id="f-minutes" type="number" min="1" max="600" step="5" required value="60">
            </label>
            <label>Datum
              <input id="f-date" type="date" required>
            </label>
          </div>
          <label>Beschreibung (optional)
            <textarea id="f-description" rows="3" maxlength="1000" placeholder="Was hast du gemacht?"></textarea>
          </label>
          <p id="form-error" class="form-error" role="alert" hidden></p>
          <button type="submit" id="submit" class="primary">Speichern</button>
        </form>
      </article>

      <article class="card entries-card">
        <div class="card-head">
          <h2>Einträge</h2>
          <form id="filter-form" class="controls">
            <select id="filter-subject" aria-label="Nach Fach filtern">
              <option value="">Alle Fächer</option>
            </select>
            <input id="filter-start" type="date" aria-label="Von">
            <input id="filter-end" type="date" aria-label="Bis">
            <button type="button" id="filter-reset" class="link">Zurücksetzen</button>
          </form>
        </div>
        <p id="filter-error" class="form-error" role="alert" hidden></p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Datum</th><th>Fach</th><th>Dauer</th><th>Beschreibung</th><th></th></tr>
            </thead>
            <tbody id="entries"></tbody>
          </table>
          <p id="empty" class="empty" hidden>Noch keine Einträge. Leg links deine erste Lerneinheit an.</p>
        </div>
      </article>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>
